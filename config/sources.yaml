  - id: wedel
    name: "Stadt Wedel"
    bundesland: SH
    system: allris
    base_url: "https://www.wedel.de/buerger-und-ratsinformationssystem-1"
    status: blocked                    # geprüft am 19.09.2026, siehe notes - kein Headless-Browser (Architekturentscheidung)
    enabled: false
    tier: A
    notes: >
      robots.txt erlaubt generische Crawler vollständig (kein Disallow auf das Ratsinformationssystem).
      Trotzdem nicht nutzbar: läuft auf "ALLRIS net" Version 4.1.7 (Apache Wicket), einer komplett
      AJAX-basierten Oberfläche - selbst der beim Aufruf von si010 angezeigte Kalendermonat wird nicht
      serverseitig gerendert, sondern erst durch einen nachgelagerten, zustandsbehafteten AJAX-Aufruf
      befüllt (sitzungsgebundene Wicket-Komponenten-IDs, keine einfachen GET-Parameter wie beim
      klassischen ALLRIS `si010.asp`, das im Quellenkatalog dokumentiert war). Dieselbe Version/
      Architektur auch bei Amt Siek, Amt Hohe Elbgeest und Amt Pinnau gefunden (andere Kandidaten im
      Hamburger Umland, robots.txt dort ebenfalls offen) - vermutlich der aktuelle Auslieferungsstand
      von CC e-govs ALLRIS net. Ein Adapter dafür bräuchte entweder eine Nachbildung des Wicket-AJAX-
      Protokolls (aufwendig, bricht potenziell bei jedem ALLRIS-Update) oder einen Headless-Browser -
      Letzteres eine bewusste Architekturentscheidung GEGEN, um das System leichtgewichtig, stabil und
      ohne Browser-Abhängigkeit wartbar zu halten (siehe CLAUDE.md, Abschnitt "Referenzquelle
      ALLRIS/Hamburger Umland"). Geesthacht (ebenfalls im Umland, robots.txt offen) zusätzlich durch
      ein explizites Bot-Abwehr-Gate (ALTCHA-Captcha) vor ALLRIS geschützt - erst recht nicht nutzbar.
      `radar/sources/allris.py` bleibt deshalb vorerst ein Stub. Reaktivieren, falls entweder (a) noch
      eine klassische, GET-basierte ALLRIS-Installation im Zielgebiet gefunden wird, oder (b) die
      Architekturentscheidung gegen einen Headless-Browser revidiert wird.
