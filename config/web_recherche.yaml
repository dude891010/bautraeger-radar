# Web-Recherche nach konkreten Bauvorhaben (radar/web_recherche.py).
# Ergänzt die Ratsunterlagen um Phase 3 (Baugenehmigung) und Phase 4 (Baubeginn), die in
# Ausschussvorlagen oft gar nicht mehr auftauchen, aber in Lokalpresse/Pressemitteilungen stehen.
# API-Key nur in .env (TAVILY_API_KEY), nie hier.

anbieter: "tavily"

# Mittelpunkt und Umkreis. Welche Orte durchsucht werden, ergibt sich aus den Koordinaten unten:
# alles mit Luftlinie <= radius_km wird abgefragt, der Rest automatisch übersprungen.
zentrum_name: "Norderstedt"
zentrum_lat: 53.7064
zentrum_lon: 9.9922
radius_km: 50

# Suchanfragen je Phase. {ort} wird durch den Ortsnamen (bzw. `suchname`) ersetzt.
# Jede Vorlage = eine API-Anfrage pro Ort -> Anzahl Orte x Anzahl Vorlagen = Anfragen pro Lauf.
suchanfragen:
  BAUGENEHMIGUNG:
    - "{ort} Baugenehmigung Neubau Wohnungen"
  BAUBEGINN:
    - "{ort} Baubeginn Spatenstich Wohnungen"

# Einordnung eines Treffers (Teilstring, Groß-/Kleinschreibung egal). Phase 4 schlägt Phase 3,
# wenn beides im Text steht (das Vorhaben ist dann schon weiter).
phasen_stichworte:
  BAUGENEHMIGUNG:
    - "Baugenehmigung"
    - "Baufreigabe"
    - "Bauantrag genehmigt"
    - "Bauantrag ist genehmigt"
    - "Genehmigung erteilt"
    - "Genehmigung liegt vor"
  BAUBEGINN:
    - "Baubeginn"
    - "Baustart"
    - "Spatenstich"
    - "Grundsteinlegung"
    - "Richtfest"
    - "Bauarbeiten begonnen"
    - "Bauarbeiten haben begonnen"

# Ohne mindestens einen dieser Begriffe ist ein Treffer kein Wohnbauprojekt (z. B. Gewerbehalle).
wohn_stichworte:
  - "Wohnung"
  - "Wohneinheit"
  - "Mehrfamilienhaus"
  - "Mehrfamilienhäuser"
  - "Wohnungsbau"
  - "Wohnquartier"
  - "Wohnanlage"
  - "Wohnprojekt"
  - "Sozialwohnung"
  - "geförderte"

# Immobilienportale verkaufen fertige Eigentumswohnungen - kein Objektgeschäft für Hummel.
ausgeschlossene_domains:
  - "immobilienscout24.de"
  - "immowelt.de"
  - "immonet.de"
  - "kleinanzeigen.de"
  - "wohnungsboerse.net"

max_ergebnisse_pro_suche: 8
zeitraum: "year"            # day | week | month | year (wie weit zurück die Suche reicht)
suchtiefe: "basic"          # basic = 1 Credit je Anfrage, advanced = 2 Credits

# Kostenbremse (jede API-Anfrage zählt). Harte Obergrenze im Code: 500.
max_anfragen_pro_lauf: 120
max_anfragen_pro_tag: 240
max_fehler_in_folge: 3      # Notbremse: danach keine weiteren Anfragen in diesem Lauf
request_delay_seconds: 1.0
timeout_seconds: 30

# Orte mit ungefährer Ortsmitte (WGS84). Entfernung wird daraus berechnet (Luftlinie).
# `stichwort`: Wort, das im Treffer vorkommen muss, damit er diesem Ort zugeordnet wird
# (Standard: name). `suchname`: abweichender Begriff für die Suchanfrage (Standard: name).
# Neue Orte einfach ergänzen - liegen sie außerhalb von radius_km, werden sie ignoriert.
